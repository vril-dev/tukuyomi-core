[package]
name = "tukuyomi-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[dependencies]
tukuyomi-kernel = { path = "../kernel" }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "signal", "io-util"] }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11.1", default-features = false }
